<h2>Dolgozók</h2>

<button class="btn btn-primary m-4" (click)="toogleFilter()">Filter</button>

<table class="table table-striped table-primary">
    <thead>
        <tr>
            <th>Id</th>
            <th>Név</th>
            <th>Település</th>
            <th>Fizetés</th>
        </tr>
    </thead>
    <tbody>
        @for(emp of employees | empfilter:actCity | nameFilter:actName; track emp.id){
        <tr>
            <td>{{emp.id}}</td>
            <td>{{emp.name}}</td>
            <td>{{emp.city}}</td>
            <td>{{emp.salary}}</td>
        </tr>
        }
    </tbody>
    <thead>
        @if(isFilterVisible){
        <tr>
            <th></th>
            <th><input type="text" [(ngModel)]="actName" id="actName"></th>
            <th><input type="text" [(ngModel)]="actCity" id="actCity"></th>
            <th></th>
        </tr>
        }
    </thead>
</table>
